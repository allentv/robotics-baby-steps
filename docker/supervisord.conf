[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid

# Display :99, not :0/:1: with network_mode:host the container shares the host's
# abstract socket namespace, where the host X server already holds X0 and X1.
[program:Xvfb]
command=Xvfb :99 -screen 0 1600x1000x24
autorestart=true
startretries=10
priority=10

[program:x11vnc]
command=x11vnc -display :99 -forever -nopw -shared -rfbport 5900
autorestart=true
startretries=10
priority=20

# Binds loopback only: reachable from the host browser, never off the machine.
# With compose network_mode:host, 127.0.0.1 is the host's loopback.
[program:websockify]
command=websockify --web /usr/share/novnc 127.0.0.1:6080 localhost:5900
autorestart=true
startretries=10
priority=30
